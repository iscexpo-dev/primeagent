[project]
name = "wfx-toolguard"
version = "0.2.2"
description = "Primeagent Policies component powered by ToolGuard."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "policies", "toolguard"]
dependencies = [
    # Keep this 1.13 backport from replacing the bundle published for 1.14.
    "wfx>=1.13.0.dev0,<1.14.0.dev0",
    "toolguard>=0.2.20,<1.0.0",
    # ToolGuard installs LiteLLM; workspace constraints do not protect standalone installs.
    "litellm>=1.103.1,<2.0.0,!=1.104.0rc1,!=1.107.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

[project.entry-points."primeagent.extensions"]
wfx-toolguard = "wfx_toolguard"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_toolguard"]
include = [
    "src/wfx_toolguard/extension.json",
    "src/wfx_toolguard/components/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_toolguard",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
