[project]
name = "wfx-duckduckgo"
version = "0.2.0"
description = "DuckDuckGo Search component as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "duckduckgo", "search"]

# Runtime deps: wfx (the BUNDLE_API surface) and the langchain-community
# binding that wraps the duckduckgo-search Python client.  wfx is floored at
# the current major.minor line (>=1.10.0) and capped below the next wfx major
# (<2.0.0) so the bundle resolves a compatible wfx; fine-grained BUNDLE_API
# compatibility is enforced separately via extension.json's
# "wfx": {"compat": [...]} contract.  langchain-community uses the same
# range the wfx tree does to keep co-installation lockstep.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "langchain-community>=0.4.1,<1.0.0",
    "ddgs>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  The value is the dotted path
# to the package containing ``extension.json`` -- the loader walks
# ``importlib.metadata.files()`` from there to find the manifest, and
# falls back to this entry-point for editable installs whose dist.files
# only surfaces dist-info entries.
[project.entry-points."primeagent.extensions"]
wfx-duckduckgo = "wfx_duckduckgo"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_duckduckgo package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_duckduckgo"]
include = ["src/wfx_duckduckgo/extension.json", "src/wfx_duckduckgo/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_duckduckgo",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
