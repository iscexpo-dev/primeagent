[project]
name = "wfx-arxiv"
version = "0.2.0"
description = "arXiv search component as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "arxiv", "search"]

# Runtime deps: wfx (the BUNDLE_API surface) plus defusedxml for safe XML
# parsing (the arxiv API returns Atom).  defusedxml is already an wfx dep
# but we list it here as a direct runtime dep so the bundle keeps building
# even if wfx drops it later.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "defusedxml>=0.7.1,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  The value is the dotted path to
# the package containing ``extension.json`` -- the loader walks
# ``importlib.metadata.files()`` from there to find the manifest, and
# falls back to this entry-point for editable installs whose dist.files
# only surfaces dist-info entries.
[project.entry-points."primeagent.extensions"]
wfx-arxiv = "wfx_arxiv"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_arxiv package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_arxiv"]
include = ["src/wfx_arxiv/extension.json", "src/wfx_arxiv/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_arxiv",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
