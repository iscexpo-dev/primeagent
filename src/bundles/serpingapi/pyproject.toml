[project]
name = "wfx-serpingapi"
version = "0.1.0"
description = "Serping API Google SERP web-search component as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "serpingapi", "search", "serp"]

# Runtime deps: wfx (the BUNDLE_API surface) plus httpx, which the component
# uses to call the Serping API search endpoint directly.  Serping API ships no
# Python SDK, so httpx is the only third-party runtime dependency; it is already an
# wfx dependency and is listed here as a direct runtime dep because the
# component imports it, keeping the bundle buildable if wfx drops it later.
# wfx is floored at the current major.minor line and capped below the next wfx
# major; the floor is read from src/wfx/pyproject.toml at port time and
# re-synced on ``make patch`` via scripts/ci/sync_bundle_wfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# wfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-serpingapi = "wfx_serpingapi"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_serpingapi package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_serpingapi"]
include = ["src/wfx_serpingapi/extension.json", "src/wfx_serpingapi/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_serpingapi",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
