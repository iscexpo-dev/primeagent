[project]
name = "wfx-oracle"
version = "0.2.0"
description = "Oracle Database components (Doc Loader, Autonomous Database Loader, Embeddings, Vector Store) as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "oracle", "oracledb", "vector-store"]

# Runtime deps: wfx (the BUNDLE_API surface) plus the Oracle packages used
# by the bundled components.
#
# wfx is floored at the current major.minor line and capped below the next
# wfx major; the floor is read from src/wfx/pyproject.toml at port time and
# re-synced on ``make patch`` via scripts/ci/sync_bundle_wfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# wfx.compat list against BUNDLE_API_VERSION.
#
# * ``oracledb`` is the Oracle Database driver used for connections.
# * ``langchain-oracledb`` provides OracleVS, OracleEmbeddings, and the
#   Oracle document loaders the components wrap.  Pins match the former
#   ``primeagent-base[oracledb]`` extra this bundle replaces.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "oracledb>=2.2.0,<4.0.0",
    "langchain-oracledb>=1.5.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-oracle = "wfx_oracle"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_oracle package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_oracle"]
include = ["src/wfx_oracle/extension.json", "src/wfx_oracle/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_oracle",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
