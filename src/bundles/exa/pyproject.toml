[project]
name = "wfx-exa"
version = "0.2.0"
description = "Exa web-search and contents tools (exa-py SDK) as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "exa", "search"]

# Runtime deps: wfx (the BUNDLE_API surface) plus the third-party imports the
# component uses directly.  ``exa-py`` replaces the deprecated
# ``metaphor-python`` SDK the pre-1.11 component shipped with; the legacy
# ``metaphor_api_key`` input is kept (hidden) so old saved flows keep working.
# ``langchain-core`` is already an wfx dep but is listed here as a direct
# runtime dep (the component imports ``langchain_core.tools.tool``) so the
# bundle keeps building even if wfx drops it later.
# wfx is floored at the current major.minor line and capped below the next wfx
# major; the floor is read from src/wfx/pyproject.toml at port time and
# re-synced on ``make patch`` via scripts/ci/sync_bundle_wfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# wfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "exa-py>=1.14,<3",
    "langchain-core>=1.2.28,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-exa = "wfx_exa"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_exa package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_exa"]
include = ["src/wfx_exa/extension.json", "src/wfx_exa/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_exa",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
