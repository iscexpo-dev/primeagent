[project]
name = "wfx-paddle"
version = "0.2.0"
description = "PaddleOCR component (OCR and layout-aware document parsing via the AI Studio async Job API) as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "paddle", "paddleocr", "ocr"]

# Runtime deps: wfx (the BUNDLE_API surface) plus any third-party imports the
# bundle's components rely on.  The PaddleOCR component talks to the PaddleOCR
# AI Studio async Job HTTP API directly via ``httpx`` -- it intentionally does
# NOT depend on the ``paddleocr`` SDK, whose transitive ``pyyaml`` constraint
# conflicts with Primeagent's dependency tree.  ``httpx`` is already a runtime
# dependency of ``wfx``; it is declared here too because the component imports
# it directly.
# wfx is floored at the current major.minor line and capped below the next wfx
# major; the floor is read from src/wfx/pyproject.toml at port time and
# re-synced on ``make patch`` via scripts/ci/sync_bundle_wfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# wfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-paddle = "wfx_paddle"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_paddle package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_paddle"]
include = ["src/wfx_paddle/extension.json", "src/wfx_paddle/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_paddle",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
