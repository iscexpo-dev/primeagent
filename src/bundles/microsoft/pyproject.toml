[project]
name = "wfx-microsoft"
version = "0.1.4"
description = "Microsoft 365 and Teams actions backed by delegated Microsoft Graph permissions."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "microsoft", "graph", "teams", "outlook", "sharepoint"]

# Runtime deps: wfx only. Every Graph adapter in this bundle speaks plain
# HTTP through ``httpx``, which wfx already ships as a runtime dependency, so
# the enterprise-hardened profile lock gains wfx-microsoft and nothing else.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

[project.entry-points."primeagent.extensions"]
wfx-microsoft = "wfx_microsoft"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_microsoft"]
include = [
    "src/wfx_microsoft/extension.json",
    "src/wfx_microsoft/**/*.py",
    "src/wfx_microsoft/components/microsoft/capabilities.v1.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_microsoft",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# The bundle's own tests run in the clean wfx + bundle venv built by
# .github/workflows/cross-bundle-test.yml, which holds pytest, pytest-asyncio
# and nothing else. Keep every test dependent on wfx + httpx only.
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated component test",
    "api_key_required: needs a real provider credential; not run in CI",  # pragma: allowlist secret
]
