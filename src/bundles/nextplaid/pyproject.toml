[project]
name = "wfx-nextplaid"
version = "0.2.0"
description = "NextPlaid multi-vector vector store (+ vLLM multivector embeddings) as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "nextplaid", "colbert", "plaid", "multi-vector", "vector-store"]

# Runtime deps: wfx (the BUNDLE_API surface) plus the third-party packages the
# bundled components import.
#
# * ``langchain-plaid`` wraps the NextPlaid server client used by
#   ``NextPlaidVectorStoreComponent``.
# * ``httpx`` is used by ``VllmMultivectorEmbeddings`` through WFX's
#   DNS-pinned provider request helper.
# * ``pillow`` backs the ColPali image path (``embed_images`` /
#   ``_data_to_pil``).  It is already an wfx dep, but is listed here so the
#   bundle keeps building if wfx drops it.
#
# wfx is floored at the current major.minor line (admitting the branch's own
# ``X.Y.0.devN`` nightlies under PEP 440) and capped below the next wfx major;
# the floor is re-synced on ``make patch`` via
# scripts/ci/sync_bundle_wfx_pin.py.  Fine-grained BUNDLE_API compatibility is
# enforced via extension.json's "wfx": {"compat": [...]} contract.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "langchain-plaid>=0.1.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pillow>=12.3.0,<13.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  The value is the dotted path to the
# package containing ``extension.json`` -- the loader walks
# ``importlib.metadata.files()`` from there to find the manifest, and falls
# back to this entry-point for editable installs whose dist.files only
# surfaces dist-info entries.
[project.entry-points."primeagent.extensions"]
wfx-nextplaid = "wfx_nextplaid"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_nextplaid package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_nextplaid"]
include = ["src/wfx_nextplaid/extension.json", "src/wfx_nextplaid/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_nextplaid",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
