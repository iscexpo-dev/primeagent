[project]
name = "wfx-empiriolabs"
version = "0.2.0"
description = "EmpirioLabs components (OpenAI-compatible chat models and image generation) as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "empiriolabs", "openai", "llm"]

# Runtime deps: wfx (the BUNDLE_API surface) plus the third-party imports the
# bundle's components rely on. EmpirioLabs exposes an OpenAI-compatible API, so
# the chat-model component reuses ``langchain_openai.ChatOpenAI``; both
# components fetch the live model list (and the image component POSTs the
# generation request) over the EmpirioLabs HTTP API via ``requests``. This
# mirrors the existing OpenAI-compatible provider bundles (novita, cometapi),
# which declare the same two runtime deps.
# wfx is floored at the current major.minor line and capped below the next wfx
# major; the floor is read from src/wfx/pyproject.toml at port time and
# re-synced on ``make patch`` via scripts/ci/sync_bundle_wfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# wfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "langchain-openai>=1.1.6",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-empiriolabs = "wfx_empiriolabs"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_empiriolabs package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_empiriolabs"]
include = ["src/wfx_empiriolabs/extension.json", "src/wfx_empiriolabs/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_empiriolabs",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
