[project]
name = "wfx-datastax"
version = "0.2.0"
description = "DataStax and Cassandra components as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "datastax"]

# Runtime deps: wfx (the BUNDLE_API surface) plus any third-party imports
# the bundle's components rely on.  REVIEW THIS LIST -- the script ports
# only ``wfx``; add any other deps the moved component(s) import.
# wfx normally uses the current major.minor floor; this bundle needs 1.12.4
# for validate_connector_hostname_for_ssrf. ``make patch`` preserves a narrower
# floor through scripts/ci/sync_bundle_wfx_pin.py. BUNDLE_API compatibility
# is enforced via extension.json's wfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "langchain-astradb~=1.0.0",
    "langchain-community>=0.4.1,<1.0.0",
    # Imported directly (astrapy.DataAPIClient/Database) by the astra components,
    # not just transitively via langchain-astradb; pin matches primeagent-base's
    # astrapy extra.
    "astrapy>=2.1.0,<3.0.0",
    "langchain-graph-retriever==0.8.0",
    "graph-retriever==0.8.0",
    "requests>=2.32.0",
    "cassio>=0.1.7",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-datastax = "wfx_datastax"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + components live inside the wfx_datastax package so
# ``importlib.metadata.files(dist)`` finds them and the loader resolves
# bundles[].path relative to the manifest's directory.
packages = ["src/wfx_datastax"]
include = [
    "src/wfx_datastax/extension.json",
    "src/wfx_datastax/base/**/*.py",
    "src/wfx_datastax/components/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_datastax",
    "extension.json",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
# This file defines a [tool.ruff.lint.*] table, which makes ruff treat this
# directory as a standalone config root. Without restating line-length, ruff
# falls back to its default of 88 here, which conflicts with the repo-wide 120
# enforced by the pre-commit ruff-format hook (run with --config pyproject.toml).
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/wfx_datastax/components/datastax/astradb_vectorstore.py" = ["S110"]
