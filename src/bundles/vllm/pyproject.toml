[project]
name = "wfx-vllm"
version = "0.2.0"
description = "vLLM as a first-class Primeagent model provider, packaged as a standalone Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "vllm", "model-provider", "openai-compatible"]

# Runtime deps: wfx supplies both the BUNDLE_API surface and the
# provider-registry seam this bundle plugs its ``providers[]`` block into. vLLM
# is OpenAI-compatible, so its model/embedding classes (``ChatOpenAI`` /
# ``OpenAIEmbeddings``) are the langchain-openai classes wfx already ships and
# resolves lazily -- the bundle does not import them directly, so it is not
# re-declared here. ``httpx`` backs the SSRF-safe, DNS-pinned live ``/v1/models``
# discovery and credential-validation probe.
# The wfx floor is the current major.minor line (the seam ships in 1.11) and is
# re-synced on ``make patch`` via scripts/ci/sync_bundle_wfx_pin.py; fine-grained
# BUNDLE_API compatibility is enforced via extension.json's wfx.compat list.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the ``primeagent.extensions``
# entry-point; editable installs whose ``dist.files`` only surfaces dist-info
# entries fall back to this entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-vllm = "wfx_vllm"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json + the discovery module live inside the wfx_vllm package so
# ``importlib.metadata.files(dist)`` finds the manifest and the registry can
# import the live-discovery / validator callables by dotted path.
packages = ["src/wfx_vllm"]
include = ["src/wfx_vllm/extension.json", "src/wfx_vllm/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_vllm",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
