[project]
name = "wfx-google"
version = "0.3.5"
description = "Google and Gemini components as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "google", "gemini"]

# Runtime deps: wfx (the BUNDLE_API surface) plus every third-party package
# imported by the Google components. Keep these dependencies with the bundle
# so a default Primeagent install can discover and build Gemini models without
# relying on the opt-in wfx-bundles metapackage.
dependencies = [
    # Requires the shared IntegrationNetworkError added for 1.13.0.
    "wfx>=1.13.0,<2.0.0",
    "google-api-python-client~=2.161",
    "google-auth>=2.38.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "oauthlib>=4.0.0,<5.0.0",  # CVE-2026-49264, CVE-2026-49265
    "google-cloud-bigquery>=3.35,<4.0.0",
    "google-genai>=1.75.0,<2.0.0",
    "langchain-community>=0.4.1,<1.0.0",
    "langchain-core>=1.2.28,<2.0.0",
    "langchain-google-community~=5.0.0",
    "langchain-google-genai~=4.1.2",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

[project.entry-points."primeagent.extensions"]
wfx-google = "wfx_google"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_google"]
include = [
    "src/wfx_google/extension.json",
    "src/wfx_google/components/**/*.py",
    # Capability manifests are runtime contract data the extension loader reads
    # from the installed package, so they must ship inside the wheel.
    "src/wfx_google/components/**/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_google",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
