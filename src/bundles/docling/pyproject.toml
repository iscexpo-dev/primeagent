[project]
name = "wfx-docling"
version = "0.2.1"
description = "Docling document processing components as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "docling", "documents"]

# Keep the full local converter and OCR stack optional. docling-core remains a
# base dependency because the bundle exchanges DoclingDocument objects even when
# conversion happens remotely.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "docling-core>=2.36.1,<3.0.0",
]

[project.optional-dependencies]
local = [
    # Older Docling releases cap Transformers below the CVE-2026-9856 fix on macOS.
    "docling>=2.132.0,<3.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tesserocr>=2.8.0",
    "rapidocr-onnxruntime>=1.4.4",
    "ocrmac>=1.0.0; sys_platform == 'darwin'",
    "torch>=2.14.0", # CVE-2025-3000: includes the bare-container annotation fix
    "torchvision>=0.21.0",
    "transformers>=5.10.1,<6.0.0", # CVE-2026-9856
]
chunking = [
    "docling-core[chunking]>=2.36.1,<3.0.0",
    "tiktoken>=0.7.0",
    "transformers>=5.10.1,<6.0.0", # CVE-2026-9856
]
image-description = [
    "wfx-docling[local]",
    "langchain-docling>=1.1.0",
]
all = [
    "wfx-docling[local,chunking,image-description]",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/bundles-docling"
Repository = "https://github.com/khulnasoft-bot/primeagent"

[project.entry-points."primeagent.extensions"]
wfx-docling = "wfx_docling"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_docling"]
include = ["src/wfx_docling/extension.json", "src/wfx_docling/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_docling",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
