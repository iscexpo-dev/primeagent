[project]
name = "wfx-slack"
version = "0.2.2"
description = "Slack Web API actions (user-identity and bot-identity) as a standalone Primeagent Extension Bundle backed by connections."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "slack", "integrations", "connections"]

# Runtime deps: wfx (the BUNDLE_API surface) plus the third-party imports the
# bundle's components rely on.
#
# ``slack_sdk`` is the substrate chosen by
# design/dedicated-integrations/matrices/slack.json (every included action's
# ``substrate_notes`` says "via slack_sdk") and by the INT-12 release-owner
# decision: one SDK for the seven Web API actions. The two trigger components
# need neither: they are declarations, and the Socket Mode client that serves
# them lives in the primeagent listener process (primeagent-base), not here.
#
# ``aiohttp`` is declared explicitly even though ``slack_sdk`` does not require
# it: ``slack_sdk.web.async_client.AsyncWebClient`` imports aiohttp at module
# import time, and .github/workflows/cross-bundle-test.yml installs only the
# bundle's *declared* dependencies, so an undeclared aiohttp fails the import
# smoke rather than degrading.
#
# wfx is floored at the current major.minor line and capped below the next wfx
# major; the floor is read from src/wfx/pyproject.toml at port time and
# re-synced on ``make patch`` via scripts/ci/sync_bundle_wfx_pin.py.
# Fine-grained BUNDLE_API compatibility is enforced via extension.json's
# wfx.compat list against BUNDLE_API_VERSION.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "slack-sdk>=3.33.0,<4.0.0",
    "aiohttp>=3.10.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-shipping distributions are discovered via the
# ``primeagent.extensions`` entry-point.  Editable installs whose
# ``dist.files`` only surfaces dist-info entries fall back to this
# entry-point to find the manifest.
[project.entry-points."primeagent.extensions"]
wfx-slack = "wfx_slack"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# extension.json, the components and the integration capability manifest live
# inside the wfx_slack package so ``importlib.metadata.files(dist)`` finds them
# and the loader resolves bundles[].path and integrations[].path relative to
# the manifest's directory.
packages = ["src/wfx_slack"]
include = [
    "src/wfx_slack/extension.json",
    "src/wfx_slack/*.py",
    "src/wfx_slack/components/**/*.py",
    "src/wfx_slack/components/slack/capabilities.v1.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_slack",
    "extension.json",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# The bundle's own tests (``tests/``) are run by
# .github/workflows/cross-bundle-test.yml in a venv holding wfx + this bundle.
# They must not import primeagent-base.
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated component test",
    "api_key_required: needs a real provider credential; not run in CI",  # pragma: allowlist secret
]
