[project]
name = "wfx-azure"
version = "0.2.0"
description = "Azure model components as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "azure", "azure-ai-foundry", "azure-openai"]

# Runtime deps cover both the dedicated Azure OpenAI components and the
# unified Azure AI Foundry provider exposed by Primeagent's Language Model
# component. Keeping them here makes the default Primeagent install complete
# without restoring the opt-in wfx-bundles metapackage.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "langchain-openai>=1.1.6",
    "langchain-azure-ai>=1.1.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

[project.entry-points."primeagent.extensions"]
wfx-azure = "wfx_azure"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_azure"]
include = [
    "src/wfx_azure/extension.json",
    "src/wfx_azure/components/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_azure",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
