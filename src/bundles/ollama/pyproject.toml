[project]
name = "wfx-ollama"
version = "0.2.0"
description = "Ollama model components as a standalone Primeagent Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "ollama", "local-models"]

# Runtime deps cover both the dedicated Ollama components and the unified
# Language Model / Embedding Model provider paths. httpx is imported directly
# by the components for SSRF-safe model discovery and validation.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
    "langchain-ollama~=0.3.10",
]

[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

[project.entry-points."primeagent.extensions"]
wfx-ollama = "wfx_ollama"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_ollama"]
include = [
    "src/wfx_ollama/extension.json",
    "src/wfx_ollama/components/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_ollama",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
