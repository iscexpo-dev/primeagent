[project.urls]
Homepage = "https://github.com/khulnasoft-bot/primeagent"
Documentation = "https://docs.prime.khulnasoft.com/extensions"
Repository = "https://github.com/khulnasoft-bot/primeagent"

# Manifest-less discovery via the ``wfx.bundles`` entry-point group (NOT
# ``primeagent.extensions``).  The loader (wfx.extension.loader._bundles_root)
# resolves this package with find_spec and folder-walks its immediate
# subdirectories -- each is one bundle at the @official slot, named after the
# directory.  No extension.json; exempt from ``wfx extension validate``.
[project.entry-points."wfx.bundles"]
wfx_bundles = "wfx_bundles"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wfx_bundles"]
include = [
    "src/wfx_bundles/**/*.py",
    "src/wfx_bundles/**/starter_projects/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/wfx_bundles",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# The bundle's own tests (``tests/``) are run by .github/workflows/cross-bundle-test.yml in a
# venv holding wfx + this bundle. They were previously in src/backend/tests/, where they skipped
# in every default install because ``wfx-bundles`` is opt-in -- see issue #14554.
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated component test",
    "api_key_required: needs a real provider credential; not run in CI",  # pragma: allowlist secret
]
