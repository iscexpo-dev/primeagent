[project]
name = "wfx-bundles"
version = "1.2.4"
description = "Primeagent's long-tail provider bundles as a single manifest-less metapackage (the langchain-community model)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Primeagent", email = "contact@prime.khulnasoft.com" },
]
keywords = ["primeagent", "wfx", "extension", "bundle", "providers"]

# Runtime: only wfx (the BUNDLE_API surface).  Each provider's third-party SDK
# is an optional extra (see [project.optional-dependencies]); installing
# wfx-bundles bare gives the provider *code* but defers each provider's SDK to
# its extra, so a user opts into exactly the providers they need.  The
# generated ``all`` extra pulls every provider's deps for explicit opt-in
# installs such as ``pip install "wfx[bundles]"`` or
# ``pip install "wfx-bundles[all]"``. 1.12.4 provides the connector SSRF helper.
dependencies = [
    "wfx>=1.13.0.dev0,<2.0.0",
]

[project.optional-dependencies]
# Per-provider extras + the generated ``all`` / ``all-no-torch`` aggregates.
# Extra keys are PEP 685-normalized (lowercase, hyphen-separated). ``all``
# and ``all-no-torch`` are GENERATED from the per-provider keys -- never
# hand-edit them. ``all`` pulls every provider; ``all-no-torch`` is ``all``
# minus the torch-pulling providers (see TORCH_EXTRAS), giving a torch-free
# superset for slim/CPU images. Managed by scripts/migrate/consolidate_bundles.py.
