name: Cross-Platform Installation Test

on:
  workflow_dispatch:
    inputs:
      primeagent-version:
        description: "Primeagent version to test from PyPI (leave empty to test from source)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      base-artifact-name:
        description: "Name of the base package artifact"
        required: false
        type: string
      main-artifact-name:
        description: "Name of the main package artifact"
        required: false
        type: string
      wfx-artifact-name:
        description: "Name of the WFX package artifact"
        required: false
        type: string
      sdk-artifact-name:
        description: "Name of the primeagent-sdk package artifact"
        required: false
        type: string
      bundles-artifact-name:
        description: "Name of the bundles package artifact (contains every src/bundles/*/ wheel)"
        required: false
        type: string
      pre_release:
        description: "Whether this is a pre-release build"
        required: false
        type: boolean
        default: false

jobs:
  build-if-needed:
    name: Build Packages (if no artifacts provided)
    runs-on: ubuntu-latest
    if: inputs.primeagent-version == '' && contains(github.workflow_ref, 'cross-platform-test.yml')
    outputs:
      base-artifact-name: ${{ steps.set-names.outputs.base-artifact-name }}
      main-artifact-name: ${{ steps.set-names.outputs.main-artifact-name }}
      wfx-artifact-name: ${{ steps.set-names.outputs.wfx-artifact-name }}
      sdk-artifact-name: ${{ steps.set-names.outputs.sdk-artifact-name }}
      bundles-artifact-name: ${{ steps.set-names.outputs.bundles-artifact-name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"
      - name: Install the project
        run: uv sync
      - name: Install frontend dependencies
        run: make install_frontendci
      - name: Build frontend
        run: make build_frontend
      - name: Build base package
        run: make build_primeagent_base args="--wheel"
      - name: Move base package to correct directory
        run: |
          # Base package builds to dist/ but should be in src/backend/base/dist/
          mkdir -p src/backend/base/dist
          mv dist/primeagent_base*.whl src/backend/base/dist/
      - name: Build WFX package
        run: |
          uv run --no-sync python scripts/ci/release_auth_defaults.py prepare
          cd src/wfx
          uv build --wheel --out-dir dist
          uv run --no-sync python ../../scripts/ci/release_auth_defaults.py verify dist/*.whl
      - name: Build SDK package
        run: |
          cd src/sdk
          uv build --wheel --out-dir dist
      - name: Build main package
        run: make build_primeagent args="--wheel"
      - name: Build bundle wheels
        id: build-bundles
        run: |
          shopt -s nullglob
          bundles=(src/bundles/*/pyproject.toml)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "No bundles found under src/bundles/*/"
            echo "bundles-found=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          mkdir -p bundles-dist
          BUNDLES_DIST="$PWD/bundles-dist"
          for bundle_pyproject in "${bundles[@]}"; do
            bundle_dir=$(dirname "$bundle_pyproject")
            echo "Building wheel for $bundle_dir"
            (cd "$bundle_dir" && uv build --wheel --out-dir "$BUNDLES_DIST")
          done
          echo "bundles-found=1" >> $GITHUB_OUTPUT
          ls -la bundles-dist/
      - name: Upload wfx artifact
        uses: actions/upload-artifact@v7
        with:
          name: adhoc-dist-wfx
          path: src/wfx/dist
      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: adhoc-dist-sdk
          path: src/sdk/dist
      - name: Upload base artifact
        uses: actions/upload-artifact@v7
        with:
          name: adhoc-dist-base
          path: src/backend/base/dist
      - name: Upload main artifact
        uses: actions/upload-artifact@v7
        with:
          name: adhoc-dist-main
          path: dist
      - name: Upload bundles artifact
        if: steps.build-bundles.outputs.bundles-found == '1'
        uses: actions/upload-artifact@v7
        with:
          name: adhoc-dist-bundles
          path: bundles-dist
      - name: Set artifact names
        id: set-names
        run: |
          echo "base-artifact-name=adhoc-dist-base" >> $GITHUB_OUTPUT
          echo "main-artifact-name=adhoc-dist-main" >> $GITHUB_OUTPUT
          echo "wfx-artifact-name=adhoc-dist-wfx" >> $GITHUB_OUTPUT
          echo "sdk-artifact-name=adhoc-dist-sdk" >> $GITHUB_OUTPUT
          if [ "${{ steps.build-bundles.outputs.bundles-found }}" = "1" ]; then
            echo "bundles-artifact-name=adhoc-dist-bundles" >> $GITHUB_OUTPUT
          else
            echo "bundles-artifact-name=" >> $GITHUB_OUTPUT
          fi

  test-installation-stable:
    name: Install & Run - ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.python-version }}
    env:
      PRIMEAGENT_SUPERUSER_PASSWORD: ci-startup-only-password  # pragma: allowlist secret
    needs: [build-if-needed]
    if: |
      always() &&
      (needs.build-if-needed.result == 'success' || needs.build-if-needed.result == 'skipped') &&
      (inputs.primeagent-version != '' || inputs.main-artifact-name != '' || needs.build-if-needed.outputs.main-artifact-name != '')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.10"
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.12"
          # macOS AMD64 (Intel) - Python 3.12 only for cost optimization
          - os: macos
            arch: amd64
            runner: macos-latest-large
            python-version: "3.12"
          # macOS ARM64 (Apple Silicon)
          - os: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.10"
          - os: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.12"
          # Windows AMD64
          - os: windows
            arch: amd64
            runner: windows-latest
            python-version: "3.10"
          - os: windows
            arch: amd64
            runner: windows-latest
            python-version: "3.12"
          # Python 3.13 - graduated from experimental to stable (blocking).
          # macOS Intel (amd64) is intentionally omitted here: like 3.10/3.12 above
          # it stays on the costly macos-latest-large runner only at 3.12. Intel
          # coverage for newer Python continues (non-blocking) in the experimental
          # 3.14 set below.
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.13"
          - os: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.13"
          - os: windows
            arch: amd64
            runner: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout authentication smoke check
        uses: actions/checkout@v7
        with:
          path: auth-smoke
          sparse-checkout: scripts/ci/check_authentication.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Determine install method
        id: install-method
        env:
          PRIMEAGENT_VERSION: ${{ inputs.primeagent-version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$PRIMEAGENT_VERSION" ]; then
              echo "method=pypi" >> $GITHUB_OUTPUT
            else
              echo "method=wheel" >> $GITHUB_OUTPUT
            fi
          else
            # workflow_call always uses wheel method (backward compatibility)
            echo "method=wheel" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: false
          ignore-empty-workdir: true

      - name: Install Protocol Buffers (macOS AMD64)
        if: matrix.os == 'macos' && matrix.arch == 'amd64'
        run: |
          if ! command -v protoc &> /dev/null; then
            brew install protobuf
          else
            echo "protoc already installed, skipping"
          fi
        shell: bash

      # Download artifacts for wheel installation
      - name: Download primeagent-sdk package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.sdk-artifact-name != '' || needs.build-if-needed.outputs.sdk-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.sdk-artifact-name || needs.build-if-needed.outputs.sdk-artifact-name || 'adhoc-dist-sdk' }}
          path: ./sdk-dist

      - name: Download WFX package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.wfx-artifact-name != '' || needs.build-if-needed.outputs.wfx-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.wfx-artifact-name || needs.build-if-needed.outputs.wfx-artifact-name || 'adhoc-dist-wfx' }}
          path: ./wfx-dist

      - name: Download base package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.base-artifact-name != '' || needs.build-if-needed.outputs.base-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.base-artifact-name || needs.build-if-needed.outputs.base-artifact-name || 'adhoc-dist-base' }}
          path: ./base-dist

      - name: Download main package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.main-artifact-name != '' || needs.build-if-needed.outputs.main-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.main-artifact-name || needs.build-if-needed.outputs.main-artifact-name || 'adhoc-dist-main' }}
          path: ./main-dist

      - name: Download bundles package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.bundles-artifact-name != '' || needs.build-if-needed.outputs.bundles-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundles-artifact-name || needs.build-if-needed.outputs.bundles-artifact-name }}
          path: ./bundles-dist

      - name: Create fresh virtual environment
        run: |
          uv venv test-env --seed
        shell: bash

      - name: Install packages from wheel
        if: steps.install-method.outputs.method == 'wheel'
        run: |
          set -eo pipefail
          shopt -s nullglob

          if [ "${{ matrix.os }}" = "windows" ]; then
            PYTHON=./test-env/Scripts/python.exe
          else
            PYTHON=./test-env/bin/python
          fi

          refresh_find_links() {
            FIND_LINKS=()
            for wheel_dir in ./sdk-dist ./wfx-dist ./base-dist ./bundles-dist; do
              if [ -d "$wheel_dir" ]; then
                FIND_LINKS+=(--find-links "$wheel_dir")
              fi
            done
          }

          install_wheels() {
            label="$1"
            shift
            if [ "$#" -eq 0 ]; then
              echo "No $label wheel found"
              exit 1
            fi
            printf 'Installing %s wheel(s):\n' "$label"
            printf '%s\n' "$@"
            refresh_find_links
            # Use `if-necessary-or-explicit` (not `allow`): nightly primeagent* wheels
            # are .dev pre-releases so we need to allow them explicitly, but `allow`
            # leaks to transitive deps and resolves pre-release pydantic alphas
            # (e.g. 2.14.0a1) which break langchain-core's module-level
            # `RunnablePassthrough()` call at import time.
            uv pip install --prerelease=if-necessary-or-explicit --python "$PYTHON" "${FIND_LINKS[@]}" "$@"
          }

          SDK_WHEELS=(./sdk-dist/*.whl)
          WFX_WHEELS=(./wfx-dist/*.whl)
          if [ ${#SDK_WHEELS[@]} -gt 0 ] || [ ${#WFX_WHEELS[@]} -gt 0 ]; then
            install_wheels "SDK/WFX" "${SDK_WHEELS[@]}" "${WFX_WHEELS[@]}"
          fi

          BASE_WHEELS=(./base-dist/*.whl)
          if [ ${#BASE_WHEELS[@]} -gt 0 ]; then
            install_wheels "base" "${BASE_WHEELS[@]}"
          fi

          if [ -d ./bundles-dist ]; then
            BUNDLE_WHEELS=(./bundles-dist/*.whl)
            install_wheels "bundle" "${BUNDLE_WHEELS[@]}"
          fi

          MAIN_WHEELS=()
          while IFS= read -r wheel; do
            MAIN_WHEELS+=("$wheel")
          done < <(find ./main-dist -name "primeagent*.whl" ! -name "primeagent_base*.whl" -type f | sort)
          if [ ${#MAIN_WHEELS[@]} -ne 1 ]; then
            echo "Expected exactly one primeagent wheel in ./main-dist, found ${#MAIN_WHEELS[@]}"
            find ./main-dist -name "*.whl" -type f | sort
            exit 1
          fi
          install_wheels "main" "${MAIN_WHEELS[@]}"
        shell: bash

      # PyPI installation steps
      - name: Install primeagent from PyPI (Windows)
        if: steps.install-method.outputs.method == 'pypi' && matrix.os == 'windows'
        env:
          PRIMEAGENT_VERSION: ${{ inputs.primeagent-version }}
        run: |
          if [ -n "$PRIMEAGENT_VERSION" ]; then
            uv pip install --python ./test-env/Scripts/python.exe "primeagent==$PRIMEAGENT_VERSION"
          else
            uv pip install --python ./test-env/Scripts/python.exe primeagent
          fi
        shell: bash

      - name: Install primeagent from PyPI (Unix)
        if: steps.install-method.outputs.method == 'pypi' && matrix.os != 'windows'
        env:
          PRIMEAGENT_VERSION: ${{ inputs.primeagent-version }}
        run: |
          if [ -n "$PRIMEAGENT_VERSION" ]; then
            uv pip install --python ./test-env/bin/python "primeagent==$PRIMEAGENT_VERSION"
          else
            uv pip install --python ./test-env/bin/python primeagent
          fi
        shell: bash

      # Install additional dependencies
      - name: Install additional dependencies (Windows)
        if: matrix.os == 'windows'
        run: |
          uv pip install --python ./test-env/Scripts/python.exe openai
        shell: bash

      - name: Install additional dependencies (Unix)
        if: matrix.os != 'windows'
        run: |
          uv pip install --python ./test-env/bin/python openai
        shell: bash

      # Test steps
      - name: Test CLI help command
        if: matrix.os == 'windows'
        run: |
          uv run --python ./test-env/Scripts/python.exe python -m primeagent --help
        shell: cmd

      - name: Test CLI help command (Unix)
        if: matrix.os != 'windows'
        run: |
          uv run --python ./test-env/bin/python python -m primeagent --help
        shell: bash

      - name: Test installed release authentication (Windows)
        if: matrix.os == 'windows'
        timeout-minutes: 5
        run: .\test-env\Scripts\python.exe auth-smoke/scripts/ci/check_authentication.py --start-server
        shell: powershell

      - name: Test installed release authentication (Unix)
        if: matrix.os != 'windows'
        timeout-minutes: 5
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
        run: ./test-env/bin/python auth-smoke/scripts/ci/check_authentication.py --start-server
        shell: bash

      - name: Test import in Python (Windows)
        if: matrix.os == 'windows'
        run: |
          test-env\Scripts\python.exe -c "
          try:
              import primeagent
              print('✅ primeagent import successful on ${{ matrix.os }}-${{ matrix.arch }}')
          except Exception as e:
              print(f'❌ primeagent import failed on ${{ matrix.os }}-${{ matrix.arch }}: {e}')
              exit(1)
          "
        shell: cmd

      - name: Test import in Python (Unix)
        if: matrix.os != 'windows'
        run: |
          ./test-env/bin/python -c "
          try:
              import primeagent
              print('✅ primeagent import successful on ${{ matrix.os }}-${{ matrix.arch }}')
          except Exception as e:
              print(f'❌ primeagent import failed on ${{ matrix.os }}-${{ matrix.arch }}: {e}')
              exit(1)
          "
        shell: bash

  test-installation-experimental:
    name: Install & Run - ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.python-version }} (Experimental)
    env:
      PRIMEAGENT_SUPERUSER_PASSWORD: ci-startup-only-password  # pragma: allowlist secret
    needs: [build-if-needed]
    if: |
      always() &&
      (needs.build-if-needed.result == 'success' || needs.build-if-needed.result == 'skipped') &&
      (inputs.primeagent-version != '' || inputs.main-artifact-name != '' || needs.build-if-needed.outputs.main-artifact-name != '')
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.14 - Experimental (non-blocking) to monitor ecosystem readiness.
          # macOS Intel (x86_64) is intentionally omitted: primeagent requires
          # onnxruntime>=1.26 on Python >=3.14 (pyproject.toml), but onnxruntime
          # dropped macOS x86_64 wheels at 1.24 — so macOS Intel + py3.14 is
          # permanently unsatisfiable (older onnxruntime that still ships macOS
          # x86_64 wheels has no cp314 ABI). macOS Intel resolves fine through 3.13;
          # arm64 has cp314 wheels. Running it would only burn the costly
          # macos-latest-large runner on a guaranteed, no-signal failure.
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.14"
          - os: windows
            arch: amd64
            runner: windows-latest
            python-version: "3.14"
          - os: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.14"

    steps:
      - name: Checkout authentication smoke check
        uses: actions/checkout@v7
        with:
          path: auth-smoke
          sparse-checkout: scripts/ci/check_authentication.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Determine install method
        id: install-method
        env:
          PRIMEAGENT_VERSION: ${{ inputs.primeagent-version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$PRIMEAGENT_VERSION" ]; then
              echo "method=pypi" >> $GITHUB_OUTPUT
            else
              echo "method=wheel" >> $GITHUB_OUTPUT
            fi
          else
            # workflow_call always uses wheel method (backward compatibility)
            echo "method=wheel" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: false
          ignore-empty-workdir: true

      - name: Install Protocol Buffers (macOS AMD64)
        if: matrix.os == 'macos' && matrix.arch == 'amd64'
        run: |
          if ! command -v protoc &> /dev/null; then
            brew install protobuf
          else
            echo "protoc already installed, skipping"
          fi
        shell: bash

      # Download artifacts for wheel installation
      - name: Download primeagent-sdk package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.sdk-artifact-name != '' || needs.build-if-needed.outputs.sdk-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.sdk-artifact-name || needs.build-if-needed.outputs.sdk-artifact-name || 'adhoc-dist-sdk' }}
          path: ./sdk-dist

      - name: Download WFX package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.wfx-artifact-name != '' || needs.build-if-needed.outputs.wfx-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.wfx-artifact-name || needs.build-if-needed.outputs.wfx-artifact-name || 'adhoc-dist-wfx' }}
          path: ./wfx-dist

      - name: Download base package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.base-artifact-name != '' || needs.build-if-needed.outputs.base-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.base-artifact-name || needs.build-if-needed.outputs.base-artifact-name || 'adhoc-dist-base' }}
          path: ./base-dist

      - name: Download main package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.main-artifact-name != '' || needs.build-if-needed.outputs.main-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.main-artifact-name || needs.build-if-needed.outputs.main-artifact-name || 'adhoc-dist-main' }}
          path: ./main-dist

      - name: Download bundles package artifact
        if: steps.install-method.outputs.method == 'wheel' && (inputs.bundles-artifact-name != '' || needs.build-if-needed.outputs.bundles-artifact-name != '')
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundles-artifact-name || needs.build-if-needed.outputs.bundles-artifact-name }}
          path: ./bundles-dist

      - name: Create fresh virtual environment
        run: |
          uv venv test-env --seed
        shell: bash

      - name: Install packages from wheel
        if: steps.install-method.outputs.method == 'wheel'
        run: |
          set -eo pipefail
          shopt -s nullglob

          if [ "${{ matrix.os }}" = "windows" ]; then
            PYTHON=./test-env/Scripts/python.exe
          else
            PYTHON=./test-env/bin/python
          fi

          refresh_find_links() {
            FIND_LINKS=()
            for wheel_dir in ./sdk-dist ./wfx-dist ./base-dist ./bundles-dist; do
              if [ -d "$wheel_dir" ]; then
                FIND_LINKS+=(--find-links "$wheel_dir")
              fi
            done
          }

          install_wheels() {
            label="$1"
            shift
            if [ "$#" -eq 0 ]; then
              echo "No $label wheel found"
              exit 1
            fi
            printf 'Installing %s wheel(s):\n' "$label"
            printf '%s\n' "$@"
            refresh_find_links
            # See stable job above for rationale on --prerelease=if-necessary-or-explicit.
            uv pip install --prerelease=if-necessary-or-explicit --python "$PYTHON" "${FIND_LINKS[@]}" "$@"
          }

          SDK_WHEELS=(./sdk-dist/*.whl)
          WFX_WHEELS=(./wfx-dist/*.whl)
          if [ ${#SDK_WHEELS[@]} -gt 0 ] || [ ${#WFX_WHEELS[@]} -gt 0 ]; then
            install_wheels "SDK/WFX" "${SDK_WHEELS[@]}" "${WFX_WHEELS[@]}"
          fi

          BASE_WHEELS=(./base-dist/*.whl)
          if [ ${#BASE_WHEELS[@]} -gt 0 ]; then
            install_wheels "base" "${BASE_WHEELS[@]}"
          fi

          if [ -d ./bundles-dist ]; then
            BUNDLE_WHEELS=(./bundles-dist/*.whl)
            install_wheels "bundle" "${BUNDLE_WHEELS[@]}"
          fi

          MAIN_WHEELS=()
          while IFS= read -r wheel; do
            MAIN_WHEELS+=("$wheel")
          done < <(find ./main-dist -name "primeagent*.whl" ! -name "primeagent_base*.whl" -type f | sort)
          if [ ${#MAIN_WHEELS[@]} -ne 1 ]; then
            echo "Expected exactly one primeagent wheel in ./main-dist, found ${#MAIN_WHEELS[@]}"
            find ./main-dist -name "*.whl" -type f | sort
            exit 1
          fi
          install_wheels "main" "${MAIN_WHEELS[@]}"
        shell: bash

      - name: Force reinstall local wheels to prevent downgrades (Windows)
        if: steps.install-method.outputs.method == 'wheel' && matrix.os == 'windows'
        run: |
          # Expose the local wheel dirs so dependency re-resolution (the
          # pre-release path below drops --no-deps) can find the local
          # pre-release SDK/WFX/base wheels. Without these, uv re-resolves
          # primeagent-base's `wfx>=X.Y.Zrc0` constraint against PyPI only, where
          # the matching rc/dev wheel is not published yet, and fails with
          # "No solution found when resolving dependencies".
          FIND_LINKS=()
          for wheel_dir in ./sdk-dist ./wfx-dist ./base-dist ./bundles-dist; do
            if [ -d "$wheel_dir" ]; then
              FIND_LINKS+=(--find-links "$wheel_dir")
            fi
          done

          # Reinstall WFX if it was provided
          if [ -n "${{ inputs.wfx-artifact-name || needs.build-if-needed.outputs.wfx-artifact-name }}" ]; then
            WFX_WHEEL=$(find ./wfx-dist -name "*.whl" -type f | head -1)
            if [ -n "$WFX_WHEEL" ]; then
              echo "Force reinstalling WFX: $WFX_WHEEL"
              INSTALL_WHEELS=("$WFX_WHEEL")
              SDK_WHEEL=""
              if [ -d ./sdk-dist ]; then
                SDK_WHEEL=$(find ./sdk-dist -name "*.whl" -type f | head -1)
              fi
              if [ -n "$SDK_WHEEL" ]; then
                echo "Force reinstalling primeagent-sdk with WFX: $SDK_WHEEL"
                INSTALL_WHEELS=("$SDK_WHEEL" "$WFX_WHEEL")
              fi
              NO_DEPS="--no-deps"
              if [ "${{ inputs.pre_release }}" = "true" ]; then
                NO_DEPS=""
              fi
              uv pip install --force-reinstall $NO_DEPS --prerelease=if-necessary-or-explicit "${FIND_LINKS[@]}" --python ./test-env/Scripts/python.exe "${INSTALL_WHEELS[@]}"
            fi
          fi

          # Reinstall base
          BASE_WHEEL=$(find ./base-dist -name "*.whl" -type f 2>/dev/null | head -1 || true)
          if [ -n "$BASE_WHEEL" ]; then
            echo "Force reinstalling primeagent-base: $BASE_WHEEL"
            INSTALL_WHEELS=("$BASE_WHEEL")
            NO_DEPS="--no-deps"
            if [ "${{ inputs.pre_release }}" = "true" ]; then
              # Keep local pre-release roots explicit while re-resolving deps. uv's
              # if-necessary-or-explicit mode does not allow pre-release transitive
              # deps found only through --find-links, such as primeagent-sdk dev wheels.
              NO_DEPS=""
              LOCAL_WHEELS=()
              if [ -d ./sdk-dist ]; then
                SDK_WHEEL=$(find ./sdk-dist -name "*.whl" -type f | head -1)
                if [ -n "$SDK_WHEEL" ]; then
                  LOCAL_WHEELS+=("$SDK_WHEEL")
                fi
              fi
              if [ -d ./wfx-dist ]; then
                WFX_WHEEL=$(find ./wfx-dist -name "*.whl" -type f | head -1)
                if [ -n "$WFX_WHEEL" ]; then
                  LOCAL_WHEELS+=("$WFX_WHEEL")
                fi
              fi
              INSTALL_WHEELS=("${LOCAL_WHEELS[@]}" "$BASE_WHEEL")
            fi
            uv pip install --force-reinstall $NO_DEPS --prerelease=if-necessary-or-explicit "${FIND_LINKS[@]}" --python ./test-env/Scripts/python.exe "${INSTALL_WHEELS[@]}"
          fi
        shell: bash

      - name: Force reinstall local wheels to prevent downgrades (Unix)
        if: steps.install-method.outputs.method == 'wheel' && matrix.os != 'windows'
        run: |
          # Expose the local wheel dirs so dependency re-resolution (the
          # pre-release path below drops --no-deps) can find the local
          # pre-release SDK/WFX/base wheels. Without these, uv re-resolves
          # primeagent-base's `wfx>=X.Y.Zrc0` constraint against PyPI only, where
          # the matching rc/dev wheel is not published yet, and fails with
          # "No solution found when resolving dependencies".
          FIND_LINKS=()
          for wheel_dir in ./sdk-dist ./wfx-dist ./base-dist ./bundles-dist; do
            if [ -d "$wheel_dir" ]; then
              FIND_LINKS+=(--find-links "$wheel_dir")
            fi
          done

          # Reinstall WFX if it was provided
          if [ -n "${{ inputs.wfx-artifact-name || needs.build-if-needed.outputs.wfx-artifact-name }}" ]; then
            WFX_WHEEL=$(find ./wfx-dist -name "*.whl" -type f | head -1)
            if [ -n "$WFX_WHEEL" ]; then
              echo "Force reinstalling WFX: $WFX_WHEEL"
              INSTALL_WHEELS=("$WFX_WHEEL")
              SDK_WHEEL=""
              if [ -d ./sdk-dist ]; then
                SDK_WHEEL=$(find ./sdk-dist -name "*.whl" -type f | head -1)
              fi
              if [ -n "$SDK_WHEEL" ]; then
                echo "Force reinstalling primeagent-sdk with WFX: $SDK_WHEEL"
                INSTALL_WHEELS=("$SDK_WHEEL" "$WFX_WHEEL")
              fi
              NO_DEPS="--no-deps"
              if [ "${{ inputs.pre_release }}" = "true" ]; then
                NO_DEPS=""
              fi
              uv pip install --force-reinstall $NO_DEPS --prerelease=if-necessary-or-explicit "${FIND_LINKS[@]}" --python ./test-env/bin/python "${INSTALL_WHEELS[@]}"
            fi
          fi

          # Reinstall base
          BASE_WHEEL=$(find ./base-dist -name "*.whl" -type f 2>/dev/null | head -1 || true)
          if [ -n "$BASE_WHEEL" ]; then
            echo "Force reinstalling primeagent-base: $BASE_WHEEL"
            INSTALL_WHEELS=("$BASE_WHEEL")
            NO_DEPS="--no-deps"
            if [ "${{ inputs.pre_release }}" = "true" ]; then
              # Keep local pre-release roots explicit while re-resolving deps. uv's
              # if-necessary-or-explicit mode does not allow pre-release transitive
              # deps found only through --find-links, such as primeagent-sdk dev wheels.
              NO_DEPS=""
              LOCAL_WHEELS=()
              if [ -d ./sdk-dist ]; then
                SDK_WHEEL=$(find ./sdk-dist -name "*.whl" -type f | head -1)
                if [ -n "$SDK_WHEEL" ]; then
                  LOCAL_WHEELS+=("$SDK_WHEEL")
                fi
              fi
              if [ -d ./wfx-dist ]; then
                WFX_WHEEL=$(find ./wfx-dist -name "*.whl" -type f | head -1)
                if [ -n "$WFX_WHEEL" ]; then
                  LOCAL_WHEELS+=("$WFX_WHEEL")
                fi
              fi
              INSTALL_WHEELS=("${LOCAL_WHEELS[@]}" "$BASE_WHEEL")
            fi
            uv pip install --force-reinstall $NO_DEPS --prerelease=if-necessary-or-explicit "${FIND_LINKS[@]}" --python ./test-env/bin/python "${INSTALL_WHEELS[@]}"
          fi
        shell: bash

      # PyPI installation steps
      - name: Install primeagent from PyPI (Windows)
        if: steps.install-method.outputs.method == 'pypi' && matrix.os == 'windows'
        env:
          PRIMEAGENT_VERSION: ${{ inputs.primeagent-version }}
        run: |
          if [ -n "$PRIMEAGENT_VERSION" ]; then
            uv pip install --python ./test-env/Scripts/python.exe "primeagent==$PRIMEAGENT_VERSION"
          else
            uv pip install --python ./test-env/Scripts/python.exe primeagent
          fi
        shell: bash

      - name: Install primeagent from PyPI (Unix)
        if: steps.install-method.outputs.method == 'pypi' && matrix.os != 'windows'
        env:
          PRIMEAGENT_VERSION: ${{ inputs.primeagent-version }}
        run: |
          if [ -n "$PRIMEAGENT_VERSION" ]; then
            uv pip install --python ./test-env/bin/python "primeagent==$PRIMEAGENT_VERSION"
          else
            uv pip install --python ./test-env/bin/python primeagent
          fi
        shell: bash

      # Install additional dependencies
      - name: Install additional dependencies (Windows)
        if: matrix.os == 'windows'
        run: |
          uv pip install --python ./test-env/Scripts/python.exe openai
        shell: bash

      - name: Install additional dependencies (Unix)
        if: matrix.os != 'windows'
        run: |
          uv pip install --python ./test-env/bin/python openai
        shell: bash

      # Test steps
      - name: Test CLI help command (Windows)
        if: matrix.os == 'windows'
        run: |
          uv run --python ./test-env/Scripts/python.exe python -m primeagent --help
        shell: cmd

      - name: Test CLI help command (Unix)
        if: matrix.os != 'windows'
        run: |
          uv run --python ./test-env/bin/python python -m primeagent --help
        shell: bash

      - name: Test installed release authentication (Windows)
        if: matrix.os == 'windows'
        timeout-minutes: 5
        run: .\test-env\Scripts\python.exe auth-smoke/scripts/ci/check_authentication.py --start-server
        shell: powershell

      - name: Test installed release authentication (Unix)
        if: matrix.os != 'windows'
        timeout-minutes: 5
        env:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
        run: ./test-env/bin/python auth-smoke/scripts/ci/check_authentication.py --start-server
        shell: bash

      - name: Test import in Python (Windows)
        if: matrix.os == 'windows'
        run: |
          test-env\Scripts\python.exe -c "
          try:
              import primeagent
              print('✅ primeagent import successful on ${{ matrix.os }}-${{ matrix.arch }}')
          except Exception as e:
              print(f'❌ primeagent import failed on ${{ matrix.os }}-${{ matrix.arch }}: {e}')
              exit(1)
          "
        shell: cmd

      - name: Test import in Python (Unix)
        if: matrix.os != 'windows'
        run: |
          ./test-env/bin/python -c "
          try:
              import primeagent
              print('✅ primeagent import successful on ${{ matrix.os }}-${{ matrix.arch }}')
          except Exception as e:
              print(f'❌ primeagent import failed on ${{ matrix.os }}-${{ matrix.arch }}: {e}')
              exit(1)
          "
        shell: bash

  test-base-runtime:
    name: Base Distribution Wheel - Linux Python 3.14
    needs: [build-if-needed]
    if: |
      always() &&
      inputs.primeagent-version == '' &&
      (needs.build-if-needed.result == 'success' || needs.build-if-needed.result == 'skipped') &&
      (inputs.base-artifact-name != '' || needs.build-if-needed.outputs.base-artifact-name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout authentication smoke check
        uses: actions/checkout@v7
        with:
          path: auth-smoke
          sparse-checkout: scripts/ci/check_authentication.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: false
          python-version: "3.14"

      - name: Download primeagent-sdk package artifact
        if: inputs.sdk-artifact-name != '' || needs.build-if-needed.outputs.sdk-artifact-name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.sdk-artifact-name || needs.build-if-needed.outputs.sdk-artifact-name || 'adhoc-dist-sdk' }}
          path: ./sdk-dist

      - name: Download WFX package artifact
        if: inputs.wfx-artifact-name != '' || needs.build-if-needed.outputs.wfx-artifact-name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.wfx-artifact-name || needs.build-if-needed.outputs.wfx-artifact-name || 'adhoc-dist-wfx' }}
          path: ./wfx-dist

      - name: Download base package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.base-artifact-name || needs.build-if-needed.outputs.base-artifact-name || 'adhoc-dist-base' }}
          path: ./base-dist

      - name: Install only the base dependency chain
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          SDK_WHEELS=(./sdk-dist/*.whl)
          WFX_WHEELS=(./wfx-dist/*.whl)
          BASE_WHEELS=(./base-dist/*.whl)
          [ ${#SDK_WHEELS[@]} -le 1 ] || { echo "Expected at most one SDK wheel"; exit 1; }
          [ ${#WFX_WHEELS[@]} -le 1 ] || { echo "Expected at most one WFX wheel"; exit 1; }
          [ ${#BASE_WHEELS[@]} -eq 1 ] || { echo "Expected one base wheel"; exit 1; }

          FIND_LINKS=()
          for directory in sdk-dist wfx-dist base-dist; do
            if [ -d "$directory" ]; then
              FIND_LINKS+=(--find-links "./$directory")
            fi
          done
          uv venv base-test-env --seed --python 3.14
          uv pip install --python base-test-env/bin/python \
            --prerelease=if-necessary-or-explicit \
            "${FIND_LINKS[@]}" "${SDK_WHEELS[@]}" "${WFX_WHEELS[@]}" "${BASE_WHEELS[0]}"
          uv pip check --python base-test-env/bin/python

      - name: Verify base boundary and indexed imports
        shell: bash
        run: |
          base-test-env/bin/python - <<'PY'
          import importlib
          import re
          import sys
          from importlib.metadata import distributions, entry_points, metadata, requires
          from pathlib import Path

          from wfx.interface.components import _read_component_index

          normalize = lambda value: re.sub(r"[-_.]+", "-", value).lower()
          installed = {normalize(dist.metadata["Name"]) for dist in distributions() if dist.metadata["Name"]}
          assert {"primeagent-base", "primeagent-sdk", "wfx"} <= installed, installed
          forbidden = installed & {"primeagent", "primeagent-core", "torch", "torchvision"}
          forbidden |= {name for name in installed if name.startswith("wfx-")}
          assert not forbidden, f"Forbidden base distributions: {sorted(forbidden)}"
          for group in ("wfx.bundles", "primeagent.extensions", "primeagent.plugins"):
              assert not entry_points(group=group), f"Extension entry points registered in {group}"

          scripts = Path(sys.executable).parent
          # Must track [project.scripts] in src/backend/base/pyproject.toml. On the
          # 1.12 line #14339 renamed this entry point back to `primeagent`; asserting
          # `primeagent-base` here is only correct on branches that predate it.
          assert (scripts / "primeagent").is_file(), f"primeagent console script missing from {scripts}"
          assert not (scripts / "primeagent-base").exists(), "primeagent-base console script is not part of the 1.12 base distribution"
          provided_extras = set(metadata("primeagent-base").get_all("Provides-Extra", []))
          assert {"complete", "all"} <= provided_extras
          compatibility_requirements = [
              requirement for requirement in (requires("primeagent-base") or [])
              if 'extra == "complete"' in requirement or 'extra == "all"' in requirement
          ]
          assert not compatibility_requirements, compatibility_requirements

          index = _read_component_index()
          assert index is not None, "Installed WFX rejected its bundled component index"
          for category, components in index["entries"]:
              for component_name, component in components.items():
                  module_path = component.get("metadata", {}).get("module")
                  assert module_path, f"{category}.{component_name} has no module"
                  module_name, class_name = module_path.rsplit(".", 1)
                  getattr(importlib.import_module(module_name), class_name)
          PY

      - name: Test installed base authentication
        shell: bash
        timeout-minutes: 5
        env:
          PRIMEAGENT_SUPERUSER_PASSWORD: ci-startup-only-password  # pragma: allowlist secret
        run: base-test-env/bin/python auth-smoke/scripts/ci/check_authentication.py --start-server

  test-summary:
    name: Cross-Platform Test Summary
    needs: [build-if-needed, test-installation-stable, test-installation-experimental, test-base-runtime]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        env:
          PRIMEAGENT_VERSION: ${{ inputs.primeagent-version }}
          EXPECT_BASE_RUNTIME: ${{ inputs.base-artifact-name != '' || needs.build-if-needed.outputs.base-artifact-name != '' }}
        run: |
          stable_result="${{ needs.test-installation-stable.result }}"
          experimental_result="${{ needs.test-installation-experimental.result }}"
          base_result="${{ needs.test-base-runtime.result }}"

          echo "Stable platforms result: $stable_result"
          echo "Experimental platforms result: $experimental_result"
          echo "Base runtime result: $base_result"

          if [ "$stable_result" = "skipped" ] && [ "$base_result" = "skipped" ]; then
            echo "✅ No Primeagent application distribution was selected; package build tests passed"
            exit 0
          fi

          if [ "$EXPECT_BASE_RUNTIME" = "true" ] && [ -z "$PRIMEAGENT_VERSION" ] && [ "$base_result" != "success" ]; then
            echo "❌ Base runtime wheel test failed: $base_result"
            exit 1
          fi

          if [ "$stable_result" = "skipped" ] && [ "$base_result" = "success" ]; then
            echo "✅ Base-only wheel installation tests passed"
            exit 0
          fi

          # Stable platforms must succeed, experimental can fail
          if [ "$stable_result" = "success" ]; then
            if [ "$experimental_result" = "success" ]; then
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                if [ -n "$PRIMEAGENT_VERSION" ]; then
                  echo "✅ All PyPI installation tests passed (including Python 3.14)"
                else
                  echo "✅ All source build and installation tests passed (including Python 3.14)"
                fi
              else
                echo "✅ All cross-platform tests passed - PyPI upload can proceed"
              fi
            else
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                if [ -n "$PRIMEAGENT_VERSION" ]; then
                  echo "✅ PyPI installation tests passed (Python 3.14 experimental failures are acceptable)"
                else
                  echo "✅ Source build and installation tests passed (Python 3.14 experimental failures are acceptable)"
                fi
              else
                echo "✅ Cross-platform tests passed - Python 3.14 experimental failures are acceptable - PyPI upload can proceed"
              fi
            fi
          elif [ "$stable_result" = "failure" ]; then
            echo "❌ Critical platform tests failed - blocking release"
            echo "Stable platforms (Python 3.10, 3.12, 3.13) must pass for release"
            exit 1
          elif [ "$stable_result" = "cancelled" ]; then
            echo "❌ Critical platform tests were cancelled"
            exit 1
          else
            echo "❌ Critical platform tests were skipped unexpectedly"
            exit 1
          fi
