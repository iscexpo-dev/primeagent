name: CI Scripts Tests

on:
  pull_request:
    paths:
      - "scripts/ci/**"
      - "design/dedicated-integrations/**"
      - "design/dedicated-integrations-triggers/**"
      - ".github/workflows/ci-scripts-test.yml"
      - ".github/workflows/backend-unit-tests.yml"
      - ".github/workflows/python_test.yml"
      - ".github/workflows/store_pytest_durations.yml"
      - ".github/workflows/test-coverage-advisor.yml"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "src/bundles/*/pyproject.toml"
      - "src/bundles/*/src/*/**/capabilities.v1.json"
      - "src/bundles/wfx-bundles/src/wfx_bundles/*/__init__.py"
      - "src/backend/base/primeagent/api/build.py"
      - "src/backend/base/primeagent/api/v1/a2a.py"
      - "src/backend/base/primeagent/api/v1/chat.py"
      - "src/backend/base/primeagent/api/v1/deployments.py"
      - "src/backend/base/primeagent/api/v1/endpoints.py"
      - "src/backend/base/primeagent/api/v1/mcp.py"
      - "src/backend/base/primeagent/api/v1/mcp_projects.py"
      - "src/backend/base/primeagent/api/v1/openai_responses.py"
      - "src/backend/base/primeagent/api/v1/voice_mode.py"
      - "src/backend/base/primeagent/api/v2/workflow*.py"
      - "src/backend/base/primeagent/api/utils/execution_errors.py"
      - "src/backend/base/primeagent/api/utils/execution_principal.py"
      - "src/backend/base/primeagent/api/utils/flow_utils.py"
      - "src/backend/base/primeagent/api/warm_graph.py"
      - "src/backend/base/primeagent/helpers/flow.py"
      - "src/backend/base/primeagent/services/connection/**"
      - "src/backend/base/primeagent/services/background_execution/**"
      - "src/backend/base/primeagent/services/connection/service.py"
      - "src/backend/base/primeagent/services/job_queue/**"
      - "src/backend/base/primeagent/api/v1/triggers.py"
      - "src/backend/base/primeagent/services/triggers/**"
      - "src/backend/tests/unit/api/**"
      - "src/backend/tests/unit/background_execution/**"
      - "src/backend/tests/unit/services/background_execution/**"
      - "src/backend/tests/unit/services/triggers/**"
      - "src/backend/tests/unit/test_redis_job_queue_service.py"
      - "src/wfx/src/wfx/run/_defaults.py"
      - "src/wfx/src/wfx/services/authorization/base.py"
      - "src/wfx/src/wfx/services/connection/**"
      - "src/wfx/tests/unit/services/connection/**"
      - "src/wfx/src/wfx/schema/message.py"
      - "src/wfx/tests/unit/schema/test_message_content_blocks.py"
      - "src/wfx/src/wfx/workflow/**"
      - "src/wfx/src/wfx/extension/integration_compat.py"
      - "src/bundles/**/extension.json"
      # GA checklist (INT-14) evidence outside the trees above. The checker only
      # proves a pointer in design/dedicated-integrations/ga-checklist.json is
      # still real on a run it is triggered for, so each cited path is named
      # here, file by file rather than globbed (docs/**), to keep unrelated docs
      # PRs off this job. test_ci_workflow_watches_the_checklist_and_checker
      # names the exact paths to add when the checklist cites something new.
      - ".github/workflows/a11y-scan.yml"
      - ".github/workflows/a11y-unit-tests.yml"
      - ".github/workflows/jest_test.yml"
      - "docs/docs/Components/bundles-google.mdx"
      - "docs/docs/Components/bundles-microsoft.mdx"
      - "docs/docs/Components/bundles-slack.mdx"
      - "docs/static/files/slack/**"
      - "src/backend/base/primeagent/api/v1/trigger_ingress.py"
      - "docs/docs/Develop/api-keys-and-authentication.mdx"
      - "docs/docs/Develop/connection-oauth.mdx"
      - "docs/docs/Develop/entra-app-registration.mdx"
      - "docs/docs/Wfx/wfx-connections.mdx"
      - "scripts/a11y/a11y_routes.json"
      - "src/backend/tests/unit/alembic/test_connection_migration.py"
      - "src/backend/tests/unit/alembic/test_connection_oauth_migration.py"
      - "src/backend/tests/unit/alembic/test_connection_oauth_workers.py"
      - "src/backend/tests/unit/services/connection/test_oauth_config.py"
      - "src/backend/tests/unit/services/connection/test_refresh_skew.py"
      - "src/bundles/microsoft/tests/test_sharepoint_actions.py"
      - "src/frontend/scripts/check-i18n.mjs"
      - "src/frontend/scripts/check-i18n.test.mjs"
      - "src/frontend/src/locales/__tests__/locale-parity.test.ts"
      - "src/wfx/tests/unit/base/mcp/test_ga_swap_procedure.py"
      - "src/wfx/tests/unit/integrations/test_contracts.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test CI release scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install jsonschema orjson packaging pytest pytest-xdist pytest-rerunfailures pytest-timeout pyyaml requests

      - name: Run CI script tests
        run: python -m pytest scripts/ci/ -v
