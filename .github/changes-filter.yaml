# https://github.com/dorny/paths-filter
python:
  - "src/backend/**"
  - "src/backend/**.py"
  - "src/wfx/**"
  # Provider bundles are first-class Python sources since the metapackage
  # split; without this a bundle-only PR reports python=false and skips the
  # backend suite entirely, including the bundle's own tests.
  - "src/bundles/**"
  - "pyproject.toml"
  - "uv.lock"
  - "src/backend/base/pyproject.toml"
  - "src/wfx/pyproject.toml"
  - "**/python_test.yml"
  - ".github/workflows/ci.yml"
  - "src/wfx/src/wfx/_assets/component_index.json"
components-changes:
  - "src/backend/base/primeagent/components/**"
  - "src/wfx/src/wfx/components/**"
  - "src/wfx/src/wfx/_assets/component_index.json"
starter-projects-changes:
  - "src/backend/base/primeagent/initial_setup/**"
frontend-tests:
  - "src/frontend/tests/**"
frontend:
  - "src/frontend/**"
  - "**/typescript_test.yml"
  - "**/jest_test.yml"
  - "**/lint-js.yml"
  - ".github/workflows/ci.yml"
  - "src/wfx/src/wfx/_assets/component_index.json"
docs:
  - "docs/**"
docker:
  - "docker/**"
  - "uv.lock"
  - "pyproject.toml"
  - "src/backend/**"
  - "src/frontend/**"
  - "src/wfx/**"
  - ".dockerignore"
  - ".github/workflows/docker-build-v2.yml"
  - ".github/workflows/docker_test.yml"

# Test categories and their associated paths
